[project]
name = "plib"
version = "0.1.0"
description = "Folder-based PDF/Markdown library served over MCP (HTTP) for agentic search"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "pymupdf>=1.24",
    "starlette",
    "uvicorn",
    "pathspec",
]

[project.scripts]
plib = "plib.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
